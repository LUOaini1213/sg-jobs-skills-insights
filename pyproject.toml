[project]
name = "jsi"
version = "0.1.0"
description = "Singapore jobs-skills insights from the public Skills Framework, SSOC and MOM labour-market data"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "requests>=2.31",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.6"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
