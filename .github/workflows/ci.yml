name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Mutation check (every mutant must be killed, control must survive)
        run: python tools/mutation_check.py
      - name: README and brief numbers match outputs
        run: python tools/check_readme.py

  reproduce:
    # Download the public sources and re-run the TF-IDF pipeline. If a publisher has released
    # a new file (hash differs from data/sources.json) the comparison is skipped with a warning,
    # because outputs are expected to change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Fetch public sources
        id: fetch
        run: |
          set +e
          python -m jsi.fetch --allow-unavailable
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "3" ]; then echo "::warning::A source file changed since data/sources.json; skipping output comparison"; exit 0; fi
          if [ "$code" = "4" ]; then echo "::notice::SingStat SSOC files unreachable from this runner; SSOC-dependent steps are skipped here and run locally"; exit 0; fi
          exit $code
      - name: Data tests
        run: pytest -q -rs tests/data
      - name: Re-run full pipeline (no embeddings) and compare with committed outputs
        if: steps.fetch.outputs.code == '0'
        run: |
          python -m jsi.pipeline
          git diff --stat
          git diff --exit-code -- outputs/
      - name: Re-run indicators and forecast backtest (no SSOC needed) and compare
        if: steps.fetch.outputs.code == '4'
        run: |
          python -m jsi.pipeline --indicators-only
          git diff --stat
          git diff --exit-code -- outputs/sector_skill_profile.csv outputs/sector_demand.csv outputs/skill_demand_index.csv outputs/emerging_skills.csv outputs/forecast_mae_ci.csv
